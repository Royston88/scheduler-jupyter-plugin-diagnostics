[build-system]
requires = ["hatchling>=1.5.0"]
build-backend = "hatchling.build"

[project]
name = "scheduler-jupyter-plugin-diagnostics"
version = "0.2.0"
description = "Pure native CLI harness for the official scheduler_jupyter_plugin on Vertex AI Workbench."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=1.10.0",
    "aiohttp>=3.9.0",
    "tornado>=6.0.0"
]

[project.scripts]
scheduler-plugin-diag = "dataproc_scheduler_diagnostics.cli:main"
dataproc-scheduler-diag = "dataproc_scheduler_diagnostics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataproc_scheduler_diagnostics"]
